<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏢 Администрация Корткеросского района</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap;">
                <div style="flex: 1;">
                    <h1>🏢 Администрация муниципального района «Корткеросский»</h1>
                    <div class="subtitle" id="address"></div>
                </div>
                <!-- Кнопка "Сказать спасибо" -->
                <div style="text-align: right; margin-top: 5px;">
                    <button id="thankYouBtn"
                            style="display: inline-block;
                                   padding: 8px 18px;
                                   font-size: 14px;
                                   font-weight: 500;
                                   color: #1e3c72;
                                   background: transparent;
                                   border: 2px solid #1e3c72;
                                   border-radius: 30px;
                                   cursor: pointer;
                                   transition: all 0.3s ease;
                                   white-space: nowrap;">
                        ❤️ Сказать спасибо
                    </button>
                </div>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Поиск по ФИО, должности, отделу...">
            </div>
        </header>
        
        <div id="loading" class="loading">⏳ Загрузка данных...</div>
        
        <div id="directory" class="directory"></div>
        
        <div id="stats" class="stats"></div>
    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const btn = document.getElementById('thankYouBtn');
            if (btn) {
                btn.addEventListener('click', function(e) {
                    // ЗАМЕНИТЕ НА СВОЙ EMAIL
                    const email = 'vasya@example.com';
                    const subject = encodeURIComponent('Спасибо за справочник!');
                    const body = encodeURIComponent('Благодарю за работу над справочником!');
                    
                    // Пробуем открыть через mailto: (работает внутри Среды)
                    const mailtoLink = `mailto:${email}?subject=${subject}&body=${body}`;
                    window.location.href = mailtoLink;
                    
                    // Через 3 секунды показываем подсказку, если письмо не открылось
                    setTimeout(function() {
                        // Проверяем, что окно не закрылось и пользователь ещё на странице
                        if (!document.hidden) {
                            // Показываем модальное окно с инструкцией
                            showModal(email);
                        }
                    }, 3000);
                });
                
                btn.addEventListener('mouseenter', function() {
                    this.style.background = '#1e3c72';
                    this.style.color = 'white';
                });
                btn.addEventListener('mouseleave', function() {
                    this.style.background = 'transparent';
                    this.style.color = '#1e3c72';
                });
            }
            
            // Функция показа модального окна с инструкцией
            function showModal(email) {
                // Удаляем старое модальное окно, если есть
                const oldModal = document.querySelector('.thankyou-modal');
                if (oldModal) oldModal.remove();
                
                const modal = document.createElement('div');
                modal.className = 'thankyou-modal';
                modal.style.cssText = `
                    position: fixed;
                    top: 0; left: 0; width: 100%; height: 100%;
                    background: rgba(0,0,0,0.5);
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    z-index: 9999;
                    backdrop-filter: blur(4px);
                `;
                
                modal.innerHTML = `
                    <div style="
                        background: white;
                        max-width: 500px;
                        width: 90%;
                        padding: 30px;
                        border-radius: 16px;
                        box-shadow: 0 20px 40px rgba(0,0,0,0.2);
                        position: relative;
                    ">
                        <button onclick="this.closest('.thankyou-modal').remove()" style="
                            position: absolute;
                            right: 15px; top: 10px;
                            font-size: 28px;
                            background: none;
                            border: none;
                            cursor: pointer;
                            color: #adb5bd;
                        ">&times;</button>
                        <h2 style="margin-top: 0; color: #1e3c72;">📧 Как отправить спасибо</h2>
                        <p>Если письмо не открылось автоматически, отправьте его вручную:</p>
                        <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin: 15px 0;">
                            <p><strong>Кому:</strong> ${email}</p>
                            <p><strong>Тема:</strong> Спасибо за справочник!</p>
                            <p><strong>Текст:</strong> Благодарю за работу над справочником!</p>
                        </div>
                        <p style="font-size: 14px; color: #6c757d;">
                            💡 Вы можете открыть почту в <strong>«Среде»</strong> и создать новое письмо с этими данными.
                        </p>
                        <button onclick="this.closest('.thankyou-modal').remove()" style="
                            background: #1e3c72;
                            color: white;
                            border: none;
                            padding: 10px 24px;
                            border-radius: 30px;
                            font-size: 14px;
                            cursor: pointer;
                            margin-top: 10px;
                        ">Понятно, спасибо</button>
                    </div>
                `;
                
                document.body.appendChild(modal);
                
                // Закрытие по клику вне окна
                modal.addEventListener('click', function(e) {
                    if (e.target === modal) {
                        modal.remove();
                    }
                });
            }
        });
    </script>
</body>
</html>
