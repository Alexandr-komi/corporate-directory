<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Справочники Корткеросского района</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .portal-container {
            max-width: 900px;
            width: 100%;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            padding: 40px;
            text-align: center;
        }

        .portal-title {
            font-size: 32px;
            color: #1e3c72;
            margin-bottom: 10px;
        }

        .portal-subtitle {
            font-size: 18px;
            color: #6c757d;
            margin-bottom: 30px;
        }

        .search-box {
            width: 100%;
            max-width: 600px;
            margin: 0 auto 30px auto;
        }

        .search-box input {
            width: 100%;
            padding: 14px 24px;
            border: 2px solid #e9ecef;
            border-radius: 50px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .search-box input:focus {
            outline: none;
            border-color: #4dabf7;
            box-shadow: 0 0 0 4px rgba(77, 171, 247, 0.15);
        }

        .search-results {
            margin: 10px 0 30px 0;
            text-align: left;
            max-height: 400px;
            overflow-y: auto;
            border-radius: 12px;
            background: #f8f9fa;
            padding: 10px;
            display: none;
        }

        .search-results.active {
            display: block;
        }

        .search-result-item {
            padding: 10px 14px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #2c3e50;
            transition: background 0.2s;
            border-radius: 8px;
        }

        .search-result-item:last-child {
            border-bottom: none;
        }

        .search-result-item:hover {
            background: #e9ecef;
        }

        .search-result-item .badge {
            font-size: 12px;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 20px;
            white-space: nowrap;
        }

        .badge-admin {
            background: #dbeafe;
            color: #1e3c72;
        }

        .badge-settlement {
            background: #d1fae5;
            color: #065f46;
        }

        .search-result-item .text {
            flex: 1;
            font-size: 14px;
        }

        .search-result-item .text .highlight {
            font-weight: 600;
            color: #1e3c72;
        }

        .search-result-item .arrow {
            color: #adb5bd;
        }

        .no-results {
            padding: 20px;
            color: #6c757d;
            font-size: 14px;
            text-align: center;
        }

        .portal-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 20px;
        }

        .portal-card {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 40px 30px;
            text-decoration: none;
            color: #2c3e50;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .portal-card:hover {
            transform: translateY(-4px);
            border-color: #4dabf7;
            box-shadow: 0 12px 30px rgba(0,0,0,0.08);
        }

        .portal-card .icon {
            font-size: 56px;
        }

        .portal-card .name {
            font-size: 22px;
            font-weight: 700;
            color: #1e3c72;
        }

        .portal-card .desc {
            font-size: 14px;
            color: #6c757d;
        }

        .portal-thanks {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #e9ecef;
        }

        .portal-thanks a {
            display: inline-block;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: 500;
            color: #1e3c72;
            background: transparent;
            border: 2px solid #1e3c72;
            border-radius: 30px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .portal-thanks a:hover {
            background: #1e3c72;
            color: white;
        }

        @media (max-width: 600px) {
            .portal-grid {
                grid-template-columns: 1fr;
            }

            .portal-title {
                font-size: 24px;
            }

            .portal-container {
                padding: 24px;
            }

            .search-box input {
                font-size: 14px;
                padding: 12px 18px;
            }
        }
    </style>
</head>
<body>
    <div class="portal-container">
        <h1 class="portal-title">📂 Справочники</h1>
        <p class="portal-subtitle">Администрация МР «Корткеросский»</p>

        <!-- Поиск -->
        <div class="search-box">
            <input type="text" id="portalSearch" placeholder="🔍 Поиск по всем справочникам...">
        </div>

        <!-- Результаты поиска -->
        <div id="searchResults" class="search-results"></div>

        <!-- Кнопки-плитки -->
        <div class="portal-grid">
            <a href="administration-directory/" class="portal-card">
                <span class="icon">🏢</span>
                <span class="name">Администрация</span>
                <span class="desc">Контакты отделов и сотрудников</span>
            </a>
            <a href="settlements/" class="portal-card">
                <span class="icon">🌾</span>
                <span class="name">Сельские поселения</span>
                <span class="desc">Контакты глав и администраций</span>
            </a>
        </div>

        <!-- Кнопка "Сказать спасибо разработчику" -->
        <div class="portal-thanks">
            <a href="https://e.armgs.team/compose/?mailto=mailto%3Aa.v.butikov%40kortkeros.rkomi.ru%3Fsubject%3D%D0%A1%D0%BF%D0%B0%D1%81%D0%B8%D0%B1%D0%BE%20%D0%B7%D0%B0%20%D1%81%D0%BF%D1%80%D0%B0%D0%B2%D0%BE%D1%87%D0%BD%D0%B8%D0%BA%21%26body%3D%D0%91%D0%BB%D0%B0%D0%B3%D0%BE%D0%B4%D0%B0%D1%80%D1%8E%20%D0%B7%D0%B0%20%D1%80%D0%B0%D0%B1%D0%BE%D1%82%D1%83%20%D0%BD%D0%B0%D0%B4%20%D1%81%D0%BF%D1%80%D0%B0%D0%B2%D0%BE%D1%87%D0%BD%D0%B8%D0%BA%D0%BE%D0%BC"
               target="_blank">
                ❤️ Сказать спасибо разработчику
            </a>
        </div>
    </div>

    <script>
        let allData = null;
        let searchTimeout = null;

        async function loadSearchData() {
            try {
                const [adminRes, settlementRes] = await Promise.all([
                    fetch('administration-directory/employees.json'),
                    fetch('settlements/contacts.json')
                ]);

                const adminData = await adminRes.json();
                const settlementData = await settlementRes.json();

                allData = {
                    admin: adminData,
                    settlements: settlementData
                };
            } catch (error) {
                console.error('Ошибка загрузки данных для поиска:', error);
            }
        }

        function searchInAdmin(data, query) {
            const results = [];
            const q = query.toLowerCase();

            data.departments.forEach(dept => {
                dept.employees.forEach(emp => {
                    if (!emp.name) return;
                    const match = 
                        emp.name.toLowerCase().includes(q) ||
                        (emp.position && emp.position.toLowerCase().includes(q)) ||
                        dept.name.toLowerCase().includes(q);
                    if (match) {
                        results.push({
                            type: 'admin',
                            label: `${dept.name} → ${emp.position ? emp.position + ' ' : ''}${emp.name}`,
                            link: 'administration-directory/',
                            highlight: emp.name
                        });
                    }
                });
            });

            return results;
        }

        function searchInSettlements(data, query) {
            const results = [];
            const q = query.toLowerCase();

            const settlements = Array.isArray(data) ? data : [data];
            settlements.forEach(district => {
                district.settlements.forEach(settlement => {
                    const match = 
                        settlement.name.toLowerCase().includes(q) ||
                        settlement.head.toLowerCase().includes(q) ||
                        (settlement.address && settlement.address.toLowerCase().includes(q));
                    if (match) {
                        results.push({
                            type: 'settlement',
                            label: `${settlement.type || ''}${settlement.name} → ${settlement.head}`,
                            link: 'settlements/',
                            highlight: settlement.name
                        });
                    }
                });
            });

            return results;
        }

        function renderResults(results) {
            const container = document.getElementById('searchResults');
            container.innerHTML = '';

            if (results.length === 0) {
                container.innerHTML = `<div class="no-results">Ничего не найдено</div>`;
                container.classList.add('active');
                return;
            }

            results.forEach(result => {
                const link = document.createElement('a');
                link.className = 'search-result-item';
                link.href = result.link;

                const badge = document.createElement('span');
                badge.className = `badge ${result.type === 'admin' ? 'badge-admin' : 'badge-settlement'}`;
                badge.textContent = result.type === 'admin' ? '🏢 Администрация' : '🌾 Поселения';

                const text = document.createElement('span');
                text.className = 'text';
                text.innerHTML = result.label;

                const arrow = document.createElement('span');
                arrow.className = 'arrow';
                arrow.textContent = '→';

                link.appendChild(badge);
                link.appendChild(text);
                link.appendChild(arrow);
                container.appendChild(link);
            });

            container.classList.add('active');
        }

        document.addEventListener('DOMContentLoaded', async function() {
            await loadSearchData();

            const searchInput = document.getElementById('portalSearch');
            const resultsContainer = document.getElementById('searchResults');

            searchInput.addEventListener('input', function(e) {
                clearTimeout(searchTimeout);
                const query = e.target.value.trim();

                if (query.length < 2) {
                    resultsContainer.classList.remove('active');
                    resultsContainer.innerHTML = '';
                    return;
                }

                searchTimeout = setTimeout(() => {
                    if (!allData) return;

                    const adminResults = searchInAdmin(allData.admin, query);
                    const settlementResults = searchInSettlements(allData.settlements, query);

                    const combined = [...adminResults, ...settlementResults];

                    if (combined.length === 0) {
                        renderResults([]);
                    } else {
                        renderResults(combined.slice(0, 15));
                    }
                }, 300);
            });
        });
    </script>
</body>
</html>
