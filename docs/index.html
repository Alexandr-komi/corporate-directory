<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Справочники Корткеросского района</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .portal-container {
            max-width: 900px;
            width: 100%;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            padding: 40px;
            text-align: center;
        }

        .portal-title {
            font-size: 32px;
            color: #1e3c72;
            margin-bottom: 10px;
        }

        .portal-subtitle {
            font-size: 18px;
            color: #6c757d;
            margin-bottom: 40px;
        }

        .portal-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        .portal-card {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 40px 30px;
            text-decoration: none;
            color: #2c3e50;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .portal-card:hover {
            transform: translateY(-4px);
            border-color: #4dabf7;
            box-shadow: 0 12px 30px rgba(0,0,0,0.08);
        }

        .portal-card .icon {
            font-size: 56px;
        }

        .portal-card .name {
            font-size: 22px;
            font-weight: 700;
            color: #1e3c72;
        }

        .portal-card .desc {
            font-size: 14px;
            color: #6c757d;
        }

        .portal-thanks {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #e9ecef;
        }

        .portal-thanks a {
            display: inline-block;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: 500;
            color: #1e3c72;
            background: transparent;
            border: 2px solid #1e3c72;
            border-radius: 30px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .portal-thanks a:hover {
            background: #1e3c72;
            color: white;
        }

        @media (max-width: 600px) {
            .portal-grid {
                grid-template-columns: 1fr;
            }

            .portal-title {
                font-size: 24px;
            }

            .portal-container {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="portal-container">
        <h1 class="portal-title">📂 Справочники</h1>
        <p class="portal-subtitle">Администрация МР «Корткеросский»</p>

        <div class="portal-grid">
            <a href="administration-directory/" class="portal-card">
                <span class="icon">🏢</span>
                <span class="name">Администрация</span>
                <span class="desc">Контакты отделов и сотрудников</span>
            </a>
            <a href="settlements/" class="portal-card">
                <span class="icon">🌾</span>
                <span class="name">Сельские поселения</span>
                <span class="desc">Контакты глав и администраций</span>
            </a>
        </div>

        <!-- Кнопка "Сказать спасибо разработчику" -->
        <div class="portal-thanks">
            <a href="https://e.armgs.team/compose/?mailto=mailto%3Aa.v.butikov%40kortkeros.rkomi.ru%3Fsubject%3D%D0%A1%D0%BF%D0%B0%D1%81%D0%B8%D0%B1%D0%BE%20%D0%B7%D0%B0%20%D1%81%D0%BF%D1%80%D0%B0%D0%B2%D0%BE%D1%87%D0%BD%D0%B8%D0%BA%21%26body%3D%D0%91%D0%BB%D0%B0%D0%B3%D0%BE%D0%B4%D0%B0%D1%80%D1%8E%20%D0%B7%D0%B0%20%D1%80%D0%B0%D0%B1%D0%BE%D1%82%D1%83%20%D0%BD%D0%B0%D0%B4%20%D1%81%D0%BF%D1%80%D0%B0%D0%B2%D0%BE%D1%87%D0%BD%D0%B8%D0%BA%D0%BE%D0%BC"
               target="_blank">
                ❤️ Сказать спасибо разработчику
            </a>
        </div>
    </div>
</body>
</html>
